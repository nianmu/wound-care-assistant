# Nginx 配置：托管前端静态产物 + 反代后端 API
# 适用：阿里云 2C2G，前端 uni-app H5 构建产物

server {
    listen 80;
    server_name _;  # 换成你的域名或 IP

    # 前端静态文件（H5 构建产物，build:h5 后复制 frontend/dist/build/h5 到 /var/www/wound-care）
    root /var/www/wound-care;
    index index.html;

    # 前端 history 路由回退（uni-app H5 默认 hash 模式，本项可保留以防切 history）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # LLM 生成可能较慢
        proxy_send_timeout 120s;
        client_max_body_size 20m;  # 教材上传体积上限
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/health;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}