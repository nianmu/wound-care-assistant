# HTTPS 预留配置（账户体系 B 模式要求）
# 域名 nianmu.top 备案通过后启用：cp 到 /etc/nginx/conf.d/wound-care-ssl.conf，
# 替换下方 ① 证书路径 ② server_name，然后 nginx -t && systemctl reload nginx。
# 注意：80 端口的 http server（wound-care.conf）会先命中，这里补 301 跳转。

# ---------- HTTP → HTTPS 全站跳转（挂在现有 wound-care.conf 的 80 server 外，单独 80 即可） ----------
server {
    listen 80;
    server_name ①nianmu.top 47.108.216.57;   # 备案通过后建议仅保留域名
    # 健康检查在 80 保留可访问（内部探测用）
    location = /healthz { proxy_pass http://127.0.0.1:8000/health; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    server_name ②nianmu.top;

    # ① 证书路径（阿里云免费证书 nginx 版，下载后上传替换）
    ssl_certificate     /etc/nginx/ssl/nianmu.top.pem;
    ssl_certificate_key /etc/nginx/ssl/nianmu.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/wound-care/h5;
    index index.html;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（与 HTTP 版一致：SSE 禁缓冲、长超时）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                     # SSE 流式
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/health;
    }
}