; Supervisor 守护后端 API（阿里云 2C2G 单 worker）
; 安装: sudo apt install supervisor
; 使用: sudo ln -s /opt/wound-care-assistant/deploy/supervisor.conf /etc/supervisor/conf.d/wound-care.conf
;       sudo supervisorctl reread && sudo supervisorctl update

[program:wound-api]
command=/opt/wound-care-assistant/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/opt/wound-care-assistant
user=ubuntu
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"
redirect_stderr=true
stdout_logfile=/var/log/wound-care/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3